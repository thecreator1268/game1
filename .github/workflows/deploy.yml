name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          # Repo is served at https://<user>.github.io/<repo>/ on GitHub
          # Pages, not domain root — see the BASE_PATH comment in
          # vite.config.ts for why this has to match at build time.
          BASE_PATH: /${{ github.event.repository.name }}/
          # Absolute origin for og:image / og:url link-preview tags.
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          # Opts the Admin Panel into this public demo build, at the site
          # owner's explicit request — see the risk this accepts in
          # src/lib/featureFlags.ts's comment (the panel's only gate is a PIN
          # whose "forgot PIN" recovery needs no prior credential at all, so
          # anyone with this URL can reach /admin and reset it unverified).
          VITE_ENABLE_ADMIN: 'true'

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
